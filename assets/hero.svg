<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="FISSY hero banner">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C122D"/>
      <stop offset="0.5" stop-color="#27336B"/>
      <stop offset="1" stop-color="#4457A6"/>
    </linearGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D6E4FF"/>
      <stop offset="1" stop-color="#C5B4FF"/>
    </linearGradient>

    <!-- Brillo suave para algunas estrellas -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

